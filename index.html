<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTElove - Vocab Learning</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<main>
    <header>
        <h1>PTElove Vocab Learning</h1>
        <p id="book-name">RS/WFD Vocab</p>

    </header>

    <section aria-labelledby="practice-word">
        <h2 id="practice-word">[Current word]</h2>
        <p id="pronunciation">[Pronunciation Guide]</p>

        <div role="group" aria-label="Vocab controls">
            <button type="button" id="previous" disabled>Previous</button>
            <button type="button" id="listen" disabled>Listen</button>
            <button type="button" id="next" disabled>Next</button>
        </div>

        <p id="position">Item [current] of [total]</p>
        <p id="status" role="status"></p>

    </section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
